name: CI

on:
  push:
    branches: [main]
  pull_request:

# The analysis engine is offline and needs no repository write authority.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: go1.27.1

jobs:
  verify:
    name: Test and vet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pull-request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          check-latest: false

      - name: Report the toolchain used for this evidence
        run: |
          go version
          go env GOVERSION GOOS GOARCH CGO_ENABLED

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod verify
          go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test under the race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Prove canonical output is deterministic across repeated runs
        run: go test ./... -run TestCanonical -count=100
